name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode and write release keystore
        run: |
          mkdir -p $HOME/keystores
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $HOME/keystores/spatialflow.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Set keystore env vars
        run: |
          echo "ANDROID_KEYSTORE_PATH=$HOME/keystores/spatialflow.jks" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS_PASSWORD=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --no-daemon --parallel

      # -------------------------------------------------------
      # Collect per-ABI splits + universal APK
      # Gradle ABI splits output:
      #   app-arm64-v8a-release.apk
      #   app-armeabi-v7a-release.apk
      #   app-x86-release.apk
      #   app-x86_64-release.apk
      #   app-universal-release.apk
      #
      # GitHubReleaseClient resolves in order:
      #   1. app-{device_abi}-release.apk  (smallest, per-device)
      #   2. app-universal-release.apk     (fallback)
      #   3. app-release.apk              (legacy)
      # -------------------------------------------------------
      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/
          cd release-artifacts
          echo "=== APK Splits ==="
          ls -lh *.apk
          echo ""
          echo "=== SHA-256 Checksums ==="
          sha256sum *.apk | tee checksum.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/checksum.txt
          body_path: RELEASE_TEMPLATE.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
